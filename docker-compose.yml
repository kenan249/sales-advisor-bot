services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: codigo_cafe
      MYSQL_USER: codigo_cafe
      MYSQL_PASSWORD: codigo_cafe
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]

volumes:
  mysql_data:
  redis_data:
